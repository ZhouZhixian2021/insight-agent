# The shipped sdk-minimal profile owns the tree; this test needs no shell tools.
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: system-prompt
  config:
    personaPrefix: 'Reply DATE_POLICY_DONE after the publication date fixture completes.'
    includeHarnessIdentity: false
    includeRuntimeContext: false
- insert:
    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'
    - id: academic-publication-date-snapshot
      name: '../../../packages/academic/workflow/tests/publication-date-snapshot-plugin.ts'
