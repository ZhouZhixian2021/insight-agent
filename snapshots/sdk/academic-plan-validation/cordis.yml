# Exercise the production review guard and plan tool through the shipped SDK profile.
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: system-prompt
  config:
    persona: 'Check the proposed Academic plan before review. Reply PLAN_CHECK_DONE after the tool results.'
    includeHarnessIdentity: false
    includeRuntimeContext: false
- insert:
    - id: academic-plan-validation
      name: '../../../packages/api/academic-research-controller/src/plan-validation.ts'
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: 'Submit the proposed plan with exit_plan_mode.'
        initialActive: true
