# Academic host services. Apply after the base and Web bundles.
# Academic full text needs a larger provider budget than ordinary Web retrieval.
- id: web-fetch-http
  config:
    maxResponseBytes: 10000000
    maxBodyChars: 5000000
    timeoutMs: 120000
    maxRedirects: 5
    userAgent: 'deepseek-harness/0.0.1 (+https://github.com/deepseek-ai)'

- insert:
    # One Session-backed Academic pass across every registered full-text source.
    - id: academic-source
      name: '@deepseek-ai/dsh-academic-source'
      config:
        searchProvider: arxiv
        searchProviders:
          - openalex
          - arxiv
        searchTimeoutMs: 25000

    - id: academic-source-openalex
      name: '@deepseek-ai/dsh-academic-source-openalex'
      config:
        maxAttempts: 2
        retryDelayMs: 1000

    - id: academic-source-arxiv
      name: '@deepseek-ai/dsh-academic-source-arxiv'
      config:
        maxAttempts: 2
        retryDelayMs: 3000

    - id: academic-source-cvf
      name: '@deepseek-ai/dsh-academic-source-cvf'
      config:
        catalogUrls:
          - https://openaccess.thecvf.com/CVPR2025?day=all
          - https://openaccess.thecvf.com/ICCV2025?day=all
          - https://openaccess.thecvf.com/WACV2025?day=all

    - id: academic-source-acl
      name: '@deepseek-ai/dsh-academic-source-acl'
      config:
        catalogUrls:
          - https://aclanthology.org/2025.acl-long/
          - https://aclanthology.org/2025.emnlp-main/
          - https://aclanthology.org/2025.naacl-long/

    - id: academic-source-pmlr
      name: '@deepseek-ai/dsh-academic-source-pmlr'
      config:
        catalogUrls:
          - https://proceedings.mlr.press/v258/
          - https://proceedings.mlr.press/v267/

    - id: academic-research-controller
      name: '@deepseek-ai/dsh-api-academic-research-controller'
      config:
        fulltextCacheDirectory: !!js dshHomePath('cache/academic-fulltext')
        fulltextFetchProvider: http
        extractionMaxTokens: 16384
        synthesisMaxTokens: 32768
        extractionMaxAttempts: 2
        extractionRetryInitialDelayMs: 10000
        extractionBatchMaxInputTokens: 12000
        extractionBatchOverlapCharacters: 512
        extractionAttemptTimeoutMs: 150000
