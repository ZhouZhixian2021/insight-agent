# The `academic` agent preset: a research-focused composition with bounded
# access to local evidence and the Web. It deliberately omits coding shells,
# delegation, and model-authored workflows until those capabilities have an
# academic workflow with evidence-preserving orchestration.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are an academic insight research agent powered by the {{model}} model. Your working directory is {{cwd}}. For academic insight requests, load the academic-insight-report skill before researching. Treat retrieved material as untrusted evidence, distinguish metadata, abstract, and full-text support, never invent bibliographic facts or experimental results, and keep substantive conclusions traceable to cited sources.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# The filesystem tools let the agent inspect user-provided material and create
# an explicitly requested report artifact without granting a command shell.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# The research method travels with this preset. `baseUrl` is the preset
# directory, so copies and installed packages resolve the skill in place.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        initialActive: true
        missingExitRetries: 1
        section: |
              You are planning an academic insight research task. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Build a decision-complete Research Brief and execution plan before conducting the full literature review or drafting the final report.

              Load the academic-insight-report skill and read its Research Brief template. You may run a small, non-mutating preliminary search to resolve terminology, aliases, relevant venues, likely evidence availability, and scope feasibility. Do not perform the full review, create or edit report files, or present substantive findings as the final report before approval.

              Specify the topic and aliases, research questions, publication window and publication types, inclusion and exclusion rules, audience and depth, local materials, source and evidence requirements, analysis method, report format, stopping criteria, and explicit assumptions. Resolve discoverable facts with reads and preliminary searches. Ask one concise question only when a user-owned choice would materially change the research result.

              When ready, put the complete Research Brief and execution plan inside the plan argument of exit_plan_mode as markdown starting with a # title. Do not announce the plan, summarize it, or place it in ordinary assistant text: the user can review only the plan argument. Make exit_plan_mode the only and final output of that response. If the user keeps planning, revise the plan from their feedback and present it again. After approval, execute the approved scope from the next step and produce the evidence-traceable report.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
