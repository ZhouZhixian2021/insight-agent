<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1850" viewBox="0 0 1660 1850"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#708092"/></marker></defs>
<rect x="60" y="145" width="1540" height="170" rx="7" fill="#fff" stroke="#bdc8d3"/><path d="M67 145 H1593 Q1600 145 1600 152 V185 H60 V152 Q60 145 67 145" fill="#eaf0f6"/><text x="830" y="172" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="600" fill="#243342">已有基础：复用现有流程与记录，不重复建设底座</text>
<rect x="60" y="350" width="1540" height="810" rx="7" fill="#fff" stroke="#bdc8d3"/><path d="M67 350 H1593 Q1600 350 1600 357 V390 H60 V357 Q60 350 67 350" fill="#eaf0f6"/><text x="830" y="377" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="600" fill="#243342">规划闭环：每轮都有具体目标、新增材料记录和质量复核</text>
<rect x="60" y="1550" width="1540" height="220" rx="7" fill="#fff" stroke="#bdc8d3"/><path d="M67 1550 H1593 Q1600 1550 1600 1557 V1590 H60 V1557 Q60 1550 67 1550" fill="#eaf0f6"/><text x="830" y="1577" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="600" fill="#243342">如何验收：使用相同计划和初始材料，对比关闭与开启循环的结果</text>
<polyline points="510,510 610,510" fill="none" stroke="#708092" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<polyline points="1050,510 1150,510" fill="none" stroke="#708092" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<polyline points="1360,590 1360,730" fill="none" stroke="#708092" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<polyline points="1150,810 1050,810" fill="none" stroke="#708092" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<polyline points="610,810 510,810" fill="none" stroke="#708092" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<polyline points="300,730 300,590" fill="none" stroke="#708092" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<polyline points="1570,510 1620,510 1620,955 1360,955 1360,1000" fill="none" stroke="#708092" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="74" y="56.7" text-anchor="start" font-family="Microsoft YaHei" font-size="30" font-weight="600" fill="#243342">04 循环补证与报告质量提升</text>
<text x="74" y="108.93" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">目的：围绕报告的具体缺口补充有效证据，再更新分析与报告｜已有有界补强作为基础；下方完整多轮反馈为 P2 规划</text>
<rect x="80" y="195" width="1500" height="100" rx="7" fill="#edf7f0" stroke="#6d947b" />
<text x="830" y="224.66" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">【已合入】计划审批、按问题选段、问题／方面覆盖检查、定向有界补强</text>
<text x="830" y="250.22" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">证据与论文版本关联、原文定位核验、运行预算与恢复、单篇深入补充</text>
<text x="830" y="275.78" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">【本次规划】把分析后的论断和数据缺口反馈到补检／补读，并支持多轮重分析与报告更新</text>
<rect x="90" y="430" width="420" height="160" rx="7" fill="#f0f4fb" stroke="#8c9fbc" stroke-dasharray="6 4"/>
<text x="300" y="476.88" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">① 更新分析与报告草稿</text>
<text x="300" y="502.44" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">根据当前有效证据回答研究问题</text>
<text x="300" y="528" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">新增证据只更新受影响的论断</text>
<text x="300" y="553.56" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">无有效证据时仅保留问题与缺口</text>
<rect x="610" y="430" width="440" height="160" rx="7" fill="#f0f4fb" stroke="#8c9fbc" stroke-dasharray="6 4"/>
<text x="830" y="476.88" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">② 检查报告质量</text>
<text x="830" y="502.44" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">哪些问题没答、哪些结论缺少依据</text>
<text x="830" y="528" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">数字与实验条件是否完整一致</text>
<text x="830" y="553.56" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">有无相反发现、范围和引用问题</text>
<rect x="1150" y="430" width="420" height="160" rx="7" fill="#f0f4fb" stroke="#8c9fbc" stroke-dasharray="6 4"/>
<text x="1360" y="476.88" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">③ 确定是否继续补证</text>
<text x="1360" y="502.44" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">按缺口的重要性排序</text>
<text x="1360" y="528" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">核对批准范围、预算和新增信息</text>
<text x="1360" y="553.56" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">允许继续才进入下一轮</text>
<rect x="1150" y="730" width="420" height="160" rx="7" fill="#f0f4fb" stroke="#8c9fbc" stroke-dasharray="6 4"/>
<text x="1360" y="776.88" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">④ 定向补检或补读</text>
<text x="1360" y="802.4399999999999" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">把缺口转成查询和阅读目标</text>
<text x="1360" y="828" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">优先补读已有论文，再按需补检</text>
<text x="1360" y="853.56" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">补足实验数据、比较条件和反证</text>
<rect x="610" y="730" width="440" height="160" rx="7" fill="#f0f4fb" stroke="#8c9fbc" stroke-dasharray="6 4"/>
<text x="830" y="776.88" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">⑤ 核验新增材料</text>
<text x="830" y="802.4399999999999" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">核对来源、论文版本与原文位置</text>
<text x="830" y="828" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">判断是否真正支持对应论断</text>
<text x="830" y="853.56" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">区分重复、无效、矛盾和有效证据</text>
<rect x="90" y="730" width="420" height="160" rx="7" fill="#f0f4fb" stroke="#8c9fbc" stroke-dasharray="6 4"/>
<text x="300" y="776.88" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">⑥ 合并证据并记录本轮结果</text>
<text x="300" y="802.4399999999999" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">追加有效证据，保留原有材料</text>
<text x="300" y="828" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">记录新增、失败、缺口与已用预算</text>
<text x="300" y="853.56" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">更新支持关系，再回到分析环节</text>
<rect x="1150" y="1000" width="420" height="130" rx="7" fill="#f7f8fa" stroke="#abb4bf" />
<text x="1360" y="1033.72" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">收尾与交付</text>
<text x="1360" y="1057.8600000000001" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">按批准要求判断正式报告或草稿</text>
<text x="1360" y="1082" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">披露剩余缺口、限制及停止原因</text>
<text x="1360" y="1106.14" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">零有效证据不生成研究结论</text>
<rect x="90" y="1000" width="960" height="130" rx="7" fill="#f7f8fa" stroke="#abb4bf" />
<text x="104" y="1044.66" text-anchor="start" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">补证目标是提高依据的充分性、结论的可信度和报告的完整性。</text>
<text x="104" y="1070.22" text-anchor="start" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">发现反证时允许修正或撤回旧论断，不把“论文更多”当成质量更好。</text>
<text x="104" y="1095.78" text-anchor="start" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">每轮保留证据和报告版本，便于比较改善在哪里、付出了多少额外成本。</text>
<rect x="60" y="1200" width="500" height="320" rx="7" fill="#f7f8fa" stroke="#abb4bf" />
<text x="74" y="1268.37" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">停止条件与交付边界</text>
<text x="74" y="1292.51" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342"></text>
<text x="74" y="1316.6499999999999" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">达到获批的交付要求，或</text>
<text x="74" y="1340.79" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">达到轮次／调用／耗时／额度上限，或</text>
<text x="74" y="1364.9299999999998" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">满足配置的“无新增有效信息”条件，</text>
<text x="74" y="1389.07" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">以及用户取消、不可恢复故障。</text>
<text x="74" y="1413.2099999999998" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342"></text>
<text x="74" y="1437.35" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">预算停止不代表质量已经合格；</text>
<text x="74" y="1461.4899999999998" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">未解决问题必须留在交付说明中。</text>
<rect x="580" y="1200" width="500" height="320" rx="7" fill="#f7f8fa" stroke="#abb4bf" />
<text x="594" y="1268.37" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">范围、失败与恢复</text>
<text x="594" y="1292.51" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342"></text>
<text x="594" y="1316.6499999999999" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">补证围绕已批准的问题和范围执行。</text>
<text x="594" y="1340.79" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">新增方向或扩大范围需再次批准。</text>
<text x="594" y="1364.9299999999998" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">无效证据不纳入结论；失败不清空</text>
<text x="594" y="1389.07" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">旧证据和已保存的报告版本。</text>
<text x="594" y="1413.2099999999998" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342"></text>
<text x="594" y="1437.35" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">保存轮次、缺口、操作、预算和版本；</text>
<text x="594" y="1461.4899999999998" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">恢复后继续未完成工作，不重置额度。</text>
<rect x="1100" y="1200" width="500" height="320" rx="7" fill="#f7f8fa" stroke="#abb4bf" />
<text x="1114" y="1256.3" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">成员分工与交接</text>
<text x="1114" y="1280.44" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342"></text>
<text x="1114" y="1304.58" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">A：循环调度、批准绑定、预算、</text>
<text x="1114" y="1328.72" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">检查点恢复和整体接入。</text>
<text x="1114" y="1352.86" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">B：按缺口补检、补读，核验新证据。</text>
<text x="1114" y="1377" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">C：评估缺口、更新分析与报告，</text>
<text x="1114" y="1401.1399999999999" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">比较补证前后的质量。</text>
<text x="1114" y="1425.28" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342"></text>
<text x="1114" y="1449.42" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">共同交接：缺口清单、有效证据、</text>
<text x="1114" y="1473.56" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">停止原因、报告版本和质量变化。</text>
<rect x="80" y="1605" width="1500" height="145" rx="7" fill="#f7f8fa" stroke="#abb4bf" />
<text x="94" y="1644.38" text-anchor="start" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">人工核对：问题回答完整性、论断支持是否充分、引用是否准确、数字与实验条件是否一致、是否披露冲突。</text>
<text x="94" y="1669.94" text-anchor="start" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">同时记录：新增有效证据、已解决／仍未解决的缺口、额外调用、耗时与成本；不只看论文数量和自动评分。</text>
<text x="94" y="1695.5" text-anchor="start" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">固定场景覆盖：补证成功、只找到重复材料、检索失败、预算耗尽、取消恢复、出现反证、零有效证据。</text>
<text x="94" y="1721.0600000000002" text-anchor="start" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">先完成固定材料对照，再验证真实论文与真实模型；如无质量增益，调整补证策略和停止条件。</text>
<text x="74" y="1817.14" text-anchor="start" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">注：流程编号是单轮执行顺序。首次分析使用已有有效证据；每次循环均复核实际质量，不保证增加轮数就一定提高质量。</text>
<rect x="1293" y="642" width="134" height="28" fill="#fff"/><text x="1360" y="662" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" fill="#516171">有缺口且允许继续</text>
<rect x="218" y="642" width="164" height="28" fill="#fff"/><text x="300" y="662" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" fill="#516171">带着新增证据再次分析</text>
<rect x="1380.5" y="933" width="179" height="28" fill="#fff"/><text x="1470" y="953" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" fill="#516171">达到要求或触发停止条件</text>
</svg>