<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1690" viewBox="0 0 1960 1690"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#708092"/></marker></defs>
<rect x="60" y="145" width="1840" height="150" rx="7" fill="#fff" stroke="#bdc8d3"/><path d="M67 145 H1893 Q1900 145 1900 152 V185 H60 V152 Q60 145 67 145" fill="#eaf0f6"/><text x="980" y="172" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="600" fill="#243342">公共基座：审批、模型与来源接口、运行预算、会话记录和证据溯源</text>
<rect x="60" y="350" width="1540" height="260" rx="7" fill="#fff" stroke="#bdc8d3"/><path d="M67 350 H1593 Q1600 350 1600 357 V390 H60 V357 Q60 350 67 350" fill="#eaf0f6"/><text x="830" y="377" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="600" fill="#243342">一、先勘察领域，再由用户决定深入研究哪些方向</text>
<rect x="60" y="670" width="1540" height="730" rx="7" fill="#fff" stroke="#bdc8d3"/><path d="M67 670 H1593 Q1600 670 1600 677 V710 H60 V677 Q60 670 67 670" fill="#eaf0f6"/><text x="830" y="697" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="600" fill="#243342">二、在获批范围内深入研究，围绕报告缺口循环补证</text>
<rect x="1640" y="350" width="260" height="1050" rx="7" fill="#fff" stroke="#bdc8d3"/><path d="M1647 350 H1893 Q1900 350 1900 357 V390 H1640 V357 Q1640 350 1647 350" fill="#eaf0f6"/><text x="1770" y="377" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="600" fill="#243342">范围变化与重新审批</text>
