<text x="74" y="56.7" text-anchor="start" font-family="Microsoft YaHei" font-size="30" font-weight="600" fill="#243342">07 领域勘察与循环补证一体架构</text>
<text x="74" y="108.93" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">组合目标架构｜绿色：复用已合入能力｜橙色：领域勘察本地实现｜蓝色虚线：规划增强｜核对日期：2026-11-03</text>
<rect x="80" y="200" width="1800" height="75" rx="7" fill="#edf7f0" stroke="#6d947b" />
<text x="980" y="229.94" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">复用已合入的模型调用、检索、会话存储、超时与部分成果保留能力。</text>
<text x="980" y="255.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="18" font-weight="400" fill="#243342">领域勘察和循环补证共同关联计划、方向、问题、证据与报告；新增多轮调度和恢复记录仍属规划。</text>
<rect x="80" y="410" width="310" height="175" rx="7" fill="#fff5e6" stroke="#bc9049" />
<text x="235" y="454.15" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">① 批准勘察计划</text>
<text x="235" y="478.28999999999996" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">主题、范围、年份和版本</text>
<text x="235" y="502.42999999999995" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">发现与遗漏复查查询</text>
<text x="235" y="526.5699999999999" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">候选数量、查询与耗时预算</text>
<text x="235" y="550.71" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">第一次用户批准</text>
<rect x="420" y="410" width="350" height="175" rx="7" fill="#fff5e6" stroke="#bc9049" />
<text x="595" y="454.15" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">② 发现候选方向</text>
<text x="595" y="478.28999999999996" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">检索标题摘要、复查遗漏</text>
<text x="595" y="502.42999999999995" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">去重并核对日期与论文版本</text>
<text x="595" y="526.5699999999999" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">模型归类，核验支持摘录</text>
<text x="595" y="550.71" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">本阶段不提取全文研究证据</text>
<rect x="800" y="410" width="350" height="175" rx="7" fill="#fff5e6" stroke="#bc9049" />
<text x="975" y="454.15" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">③ 保存候选方向图谱</text>
<text x="975" y="478.28999999999996" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">方向、出处、未分类论文与限制</text>
<text x="975" y="502.42999999999995" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">无方向时调整勘察计划再审批</text>
<text x="975" y="526.5699999999999" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">有可研究方向才拟定深研计划</text>
<text x="975" y="550.71" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">标题摘要图谱不作为全文证据</text>
<rect x="1180" y="410" width="400" height="175" rx="7" fill="#fff5e6" stroke="#bc9049" />
<text x="1380" y="454.15" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">④ 批准深入研究计划</text>
<text x="1380" y="478.28999999999996" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">全部方向分配：深入／概览／不覆盖</text>
<text x="1380" y="502.42999999999995" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">深入方向配置问题、证据目标和预算</text>
<text x="1380" y="526.5699999999999" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">第二次用户批准，绑定准确的勘察身份</text>
<text x="1380" y="550.71" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">确定本轮范围与补检额度</text>
<rect x="80" y="730" width="420" height="150" rx="7" fill="#edf7f0" stroke="#6d947b" />
<text x="290" y="773.72" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">⑤ 证据采集与有效证据集</text>
<text x="290" y="797.86" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">初次：检索、全文获取、证据提取</text>
<text x="290" y="822" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">增量：核验后追加，保留原有材料</text>
<text x="290" y="846.14" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">按论文版本、问题和方向关联</text>
<rect x="610" y="730" width="440" height="150" rx="7" fill="#edf7f0" stroke="#6d947b" />
<text x="830" y="773.72" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">⑥ 分析与报告草稿</text>
<text x="830" y="797.86" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">按方向与问题汇总有效依据</text>
<text x="830" y="822" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">说明结论、引用及适用条件</text>
<text x="830" y="846.14" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">【规划】补证后更新论断与报告</text>
<rect x="1150" y="730" width="420" height="150" rx="7" fill="#f0f4fb" stroke="#8c9fbc" stroke-dasharray="6 4"/>
<text x="1360" y="773.72" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">⑦ 逐方向检查报告质量</text>
<text x="1360" y="797.86" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">已有基础：证据目标与引用核查</text>
<text x="1360" y="822" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">【规划】检查论断、数字、条件与反证</text>
<text x="1360" y="846.14" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">形成可以补检或补读的缺口清单</text>
<rect x="1150" y="1050" width="420" height="175" rx="7" fill="#f0f4fb" stroke="#8c9fbc" stroke-dasharray="6 4"/>
<text x="1360" y="1106.22" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">⑧ 补证决策与范围检查</text>
<text x="1360" y="1130.3600000000001" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">缺口是否在已批准研究范围内？</text>
<text x="1360" y="1154.5" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">是否还有预算和新增信息空间？</text>
<text x="1360" y="1178.64" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">决定继续补证、收尾或调整计划</text>
<rect x="610" y="1050" width="440" height="175" rx="7" fill="#f0f4fb" stroke="#8c9fbc" stroke-dasharray="6 4"/>
<text x="830" y="1094.15" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">⑨ 定向补检或补读</text>
<text x="830" y="1118.2900000000002" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">把缺口转成查询与阅读目标</text>
<text x="830" y="1142.43" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">优先补读已有材料，再按需找新论文</text>
<text x="830" y="1166.5700000000002" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">补齐论断依据、实验条件和相反证据</text>
<text x="830" y="1190.71" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">不得擅自扩大获批范围</text>
<rect x="80" y="1050" width="420" height="175" rx="7" fill="#f0f4fb" stroke="#8c9fbc" stroke-dasharray="6 4"/>
<text x="290" y="1094.15" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">⑩ 核验并保存补充结果</text>
<text x="290" y="1118.2900000000002" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">核对来源、版本、原文与支持关系</text>
<text x="290" y="1142.43" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">去重、保留反证，失败保留旧成果</text>
<text x="290" y="1166.5700000000002" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">记录新增证据、未解决缺口及成本</text>
<text x="290" y="1190.71" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">有效结果追加到证据集，再次分析</text>
<rect x="80" y="1280" width="970" height="95" rx="7" fill="#f7f8fa" stroke="#abb4bf" />
<text x="94" y="1308.29" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">停止：达到获批要求，或预算耗尽、无新增有效信息、用户取消等。</text>
<text x="94" y="1332.43" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">每轮比较问题完整性、论断支持与额外成本，发现反证时允许修正旧结论。</text>
<text x="94" y="1356.57" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">未达到交付要求时披露限制和剩余缺口；补证失败不清空原有成果。</text>
<rect x="1150" y="1280" width="420" height="95" rx="7" fill="#f7f8fa" stroke="#abb4bf" />
<text x="1360" y="1308.29" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">报告交付与剩余缺口</text>
<text x="1360" y="1332.43" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">按批准要求判断正式报告或草稿</text>
<text x="1360" y="1356.57" text-anchor="middle" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">无有效证据不生成研究结论</text>
<rect x="1660" y="410" width="220" height="175" rx="7" fill="#f0f4fb" stroke="#8c9fbc" stroke-dasharray="6 4"/>
<text x="1770" y="456.7" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">重新审批后再执行</text>
<text x="1770" y="479.41999999999996" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">已有方向的范围变化</text>
<text x="1770" y="502.14" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">→ 回到深研审批</text>
<text x="1770" y="524.86" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">新增图谱之外的方向</text>
<text x="1770" y="547.5799999999999" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">→ 回到勘察审批</text>
<rect x="1660" y="650" width="220" height="150" rx="7" fill="#f7f8fa" stroke="#abb4bf" />
<text x="1770" y="684.2" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">新方向作为待审线索</text>
<text x="1770" y="706.9200000000001" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">说明来源与变更原因</text>
<text x="1770" y="729.6400000000001" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">不直接加入获批范围</text>
<text x="1770" y="752.36" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">不直接写成研究结论</text>
<text x="1770" y="775.08" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">新勘察后重新绑定计划</text>
<rect x="1660" y="930" width="220" height="200" rx="7" fill="#f0f4fb" stroke="#8c9fbc" stroke-dasharray="6 4"/>
<text x="1770" y="977.84" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">范围／方向改变</text>
<text x="1770" y="1000.5600000000001" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">先保留已有成果</text>
<text x="1770" y="1023.28" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">调整研究深度或范围</text>
<text x="1770" y="1046" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">再次确认计划与预算</text>
<text x="1770" y="1068.72" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">若新增方向不在图谱</text>
<text x="1770" y="1091.44" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">先批准补充勘察</text>
<rect x="1660" y="1210" width="220" height="155" rx="7" fill="#f7f8fa" stroke="#abb4bf" />
<text x="1770" y="1246.7" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">范围内补证</text>
<text x="1770" y="1269.42" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">沿用已批准的边界</text>
<text x="1770" y="1292.14" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">无需每轮重新审批</text>
<text x="1770" y="1314.8600000000001" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">新增方向或扩大范围</text>
<text x="1770" y="1337.58" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">才进入计划调整流程</text>
<rect x="60" y="1450" width="900" height="145" rx="7" fill="#f7f8fa" stroke="#abb4bf" />
<text x="74" y="1491.22" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">数据贯通与恢复边界</text>
<text x="74" y="1515.3600000000001" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">勘察身份 → 方向 → 批准问题 → 证据 → 论断 → 报告版本</text>
<text x="74" y="1539.5" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">补证轮次、失败、已用预算和剩余缺口的持续记录属于循环增强规划。</text>
<text x="74" y="1563.64" text-anchor="start" font-family="Microsoft YaHei" font-size="17" font-weight="400" fill="#243342">勘察目前可复用保存结果，查询级中断续跑尚未实现。</text>
<rect x="1000" y="1450" width="900" height="145" rx="7" fill="#f7f8fa" stroke="#abb4bf" />
