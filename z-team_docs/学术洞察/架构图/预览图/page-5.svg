<rect x="60" y="150" width="1540" height="145" rx="7" fill="#fff" stroke="#bdc8d3"/><path d="M67 150 H1593 Q1600 150 1600 157 V190 H60 V157 Q60 150 67 150" fill="#eaf0f6"/><text x="830" y="177" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="600" fill="#243342">公共基座：沿用现有审批、来源、模型与会话服务</text>
<rect x="60" y="340" width="1540" height="550" rx="7" fill="#fff" stroke="#bdc8d3"/><path d="M67 340 H1593 Q1600 340 1600 347 V380 H60 V347 Q60 340 67 340" fill="#eaf0f6"/><text x="830" y="367" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="600" fill="#243342">阶段一：单独批准元数据勘察，发现有出处的候选方向</text>
<rect x="60" y="940" width="1540" height="260" rx="7" fill="#fff" stroke="#bdc8d3"/><path d="M67 940 H1593 Q1600 940 1600 947 V980 H60 V947 Q60 940 67 940" fill="#eaf0f6"/><text x="830" y="967" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="600" fill="#243342">阶段二：审阅图谱与遗漏，重新批准逐方向研究计划</text>
<rect x="60" y="1250" width="1540" height="290" rx="7" fill="#fff" stroke="#bdc8d3"/><path d="M67 1250 H1593 Q1600 1250 1600 1257 V1290 H60 V1257 Q60 1250 67 1250" fill="#eaf0f6"/><text x="830" y="1277" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="600" fill="#243342">阶段三：把获批方向交给已有全文证据流程，逐方向核对交付</text>
<rect x="60" y="1585" width="1540" height="260" rx="7" fill="#fff" stroke="#bdc8d3"/><path d="M67 1585 H1593 Q1600 1585 1600 1592 V1625 H60 V1592 Q60 1585 67 1585" fill="#eaf0f6"/><text x="830" y="1612" text-anchor="middle" font-family="Microsoft YaHei" font-size="20" font-weight="600" fill="#243342">当前能力边界与下一步完善</text>
