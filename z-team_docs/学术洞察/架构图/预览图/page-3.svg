<text x="849" y="1601.95" text-anchor="start" font-family="Microsoft YaHei" font-size="15" font-weight="400" fill="#243342">z-team_docs/开发记录/2026-11-02-yzyhello-抽取派发按问题检索排序.md</text>
<text x="849" y="1623.25" text-anchor="start" font-family="Microsoft YaHei" font-size="15" font-weight="400" fill="#243342">Git主分支为依据；领域勘察说明中含未提交实现。</text>
<text x="74" y="1774.64" text-anchor="start" font-family="Microsoft YaHei" font-size="16" font-weight="400" fill="#243342">边界：正文依据来源记录；元数据勘察不充当全文证据；没有完整真实验收的功能不标记为“质量已达标”。分工与顺序为本次建议。</text>
