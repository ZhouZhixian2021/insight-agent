<text x="849" y="1538.05" text-anchor="start" font-family="Microsoft YaHei" font-size="15" font-weight="400" fill="#243342">docs/subsystems/academic-insight.zh.md：当前模块与接口</text>
<text x="849" y="1559.3500000000001" text-anchor="start" font-family="Microsoft YaHei" font-size="15" font-weight="400" fill="#243342">docs/upgrade-guide/：日期、覆盖、定向补强、后台进度</text>
